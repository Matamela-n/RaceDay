name: Validate RaceDay Repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: test -d docs

      - name: Check ERD file exists
        run: test -f docs/RaceDay_ERD.png

      - name: Check API endpoint plan exists
        run: test -f docs/API_Endpoint_Plan.pdf

      - name: Check SQL script exists
        run: test -f docs/RaceDay_Database.sql

      - name: Check README exists
        run: test -f README.md
