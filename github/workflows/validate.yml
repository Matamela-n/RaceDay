
name: Validate RaceDay Part 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check docs folder exists
        run: test -d docs

      - name: Check ERD file exists
        run: test -f "ERD STEP 1.drawio.png"

      - name: Check API endpoint plan exists
        run: test -f "docs/api endpoint plan.pdf"

      - name: Check SQL script exists
        run: test -f "docs/RACEDAY.sql"

      - name: Check docs README exists
        run: test -f "docs/README.md"

      - name: Restore API dependencies
        run: dotnet restore RACEDAY_API_PROJECT.csproj

      - name: Build API
        run: dotnet build RACEDAY_API_PROJECT.csproj --configuration Release --no-restore

      - name: Restore test dependencies
        run: dotnet restore RACEDAY_API_PROJECT.Tests/RACEDAY_API_PROJECT.Tests.csproj

      - name: Run unit tests
        run: dotnet test RACEDAY_API_PROJECT.Tests/RACEDAY_API_PROJECT.Tests.csproj --configuration Release --no-restore
